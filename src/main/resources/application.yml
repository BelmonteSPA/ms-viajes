server:
  port: 8084
  forward-headers-strategy: framework

spring:
  application:
    name: ms-viajes

  profiles:
    active: dev

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/db_viajes?createDatabaseIfNotExist=true&serverTimezone=America/Santiago}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

# URLs de los otros microservicios (con Eureka activo se dejan vacias y se resuelve por nombre)
clients:
  pasajeros:
    url: ${MS_PASAJEROS_URL:http://localhost:8082}
  conductores:
    url: ${MS_CONDUCTORES_URL:http://localhost:8083}

eureka:
  client:
    enabled: false
